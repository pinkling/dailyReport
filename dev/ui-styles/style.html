<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UI 风格 Demo 预览</title>
<style>
:root{--bg:#0b0f1a;--card:#131a2b;--card2:#1a2337;--line:#243049;--txt:#e8edf7;--sub:#93a1bd;--neon:#3ddc97;--neon-dim:rgba(61,220,151,.14);--neon-line:rgba(61,220,151,.35);--blue:#5b8cff;--gold:#f5c451}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#2b3a5c;border-radius:3px}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px 60px}
.bar{display:flex;align-items:center;gap:10px;padding:16px 0 12px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 78%,transparent);z-index:20}
.back{color:var(--sub);font-size:12.5px;text-decoration:none;white-space:nowrap}
.back:hover{color:var(--neon)}
.tt{flex:1;min-width:0}
.tt .nm{font-size:16.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .zh{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:6px}
.nav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:15px;cursor:pointer}
.nav button:hover{border-color:var(--neon-line);color:var(--neon)}
.nav button:disabled{opacity:.35;cursor:default}
/* 浏览器窗口 */
.frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);margin-top:4px}
.chrome{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card2)}
.chrome i{width:10px;height:10px;border-radius:50%;background:#2e3d5e;display:block}
.chrome i:nth-child(1){background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
.chrome .url{flex:1;text-align:center;font-size:11px;color:var(--sub);background:var(--bg);border-radius:7px;padding:3px 10px;margin:0 42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewport{position:relative;overflow:hidden;background:#0e1420}
.viewport iframe{border:none;display:block;transform-origin:top left;background:#fff;width:960px;height:640px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12.5px}
/* 信息区 */
.info{display:grid;grid-template-columns:1.1fr 1.2fr .9fr;gap:12px;margin-top:14px}
@media (max-width:860px){.info{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.info{grid-template-columns:1fr}}
.col{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;min-width:0}
.col h3{font-size:11.5px;color:var(--neon);letter-spacing:.08em;margin:12px 0 7px;font-weight:700}
.col h3:first-child{margin-top:0}
.col p{font-size:12.5px;color:var(--sub);line-height:1.65;word-break:break-word}
.col p.mono{font-family:Consolas,"Courier New",monospace;font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;max-height:150px;overflow:auto}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags i{font-style:normal;font-size:11px;background:var(--bg);border:1px solid var(--line);color:var(--sub);padding:2px 9px;border-radius:7px}
.palette{display:flex;flex-wrap:wrap;gap:7px}
.pal{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--sub);font-family:Consolas,monospace}
.pal i{width:20px;height:20px;border-radius:6px;border:1px solid rgba(255,255,255,.14);display:block}
.mt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.badge{padding:1.5px 9px;border-radius:999px;font-weight:700;font-size:10.5px}
.badge.landing{background:rgba(91,140,255,.16);color:#9db9ff}
.badge.dash{background:rgba(245,196,81,.14);color:var(--gold)}
.badge.mobile{background:rgba(192,132,252,.16);color:#c084fc}
.badge.st-active{background:var(--neon-dim);color:var(--neon)}
.badge.st-supplemental{background:rgba(91,140,255,.14);color:#9db9ff}
.badge.st-deprecated{background:rgba(147,161,189,.14);color:var(--sub)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.kv dt{color:var(--sub);white-space:nowrap}
.kv dd{color:var(--txt);min-width:0;word-break:break-word}
.openbtn{display:block;text-align:center;margin-top:14px;padding:10px 0;border-radius:10px;border:1px solid var(--neon-line);background:var(--neon-dim);color:var(--neon);font-size:13px;font-weight:700;text-decoration:none}
.openbtn:hover{background:rgba(61,220,151,.22)}
.note{border:1px solid rgba(245,196,81,.3);background:rgba(245,196,81,.07);border-radius:9px;padding:9px 12px;font-size:12px;color:var(--gold);margin-top:8px}
@media (max-width:600px){.chrome .url{margin:0 8px}.tt .nm{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="back" href="index.html">← 图鉴</a>
    <div class="tt"><div class="nm" id="nm">加载中…</div><div class="zh" id="zh"></div></div>
    <div class="nav">
      <button id="prev" title="上一个">←</button>
      <button id="next" title="下一个">→</button>
    </div>
  </div>

  <div class="frame">
    <div class="chrome"><i></i><i></i><i></i><div class="url" id="url">demos/…</div></div>
    <div class="viewport" id="viewport">
      <div class="loading" id="loading">Demo 加载中…</div>
      <iframe id="ifr" title="style demo" loading="eager"></iframe>
    </div>
  </div>

  <div class="info">
    <div class="col">
      <h3>分类</h3>
      <div class="mt" id="badges"></div>
      <h3>关键词</h3>
      <div class="tags" id="kw"></div>
      <h3>适用场景</h3>
      <p id="bestfor"></p>
      <h3>避免用于</h3>
      <p id="avoid"></p>
      <div id="noteWrap" style="display:none"><div class="note" id="note"></div></div>
    </div>
    <div class="col">
      <h3>色板（含官方推荐色）</h3>
      <div class="palette" id="pal"></div>
      <h3>设计系统变量</h3>
      <p class="mono" id="vars"></p>
      <h3>技术关键词</h3>
      <p class="mono" id="css"></p>
      <h3>动效与交互要点</h3>
      <p id="effects"></p>
    </div>
    <div class="col">
      <h3>元信息</h3>
      <dl class="kv" id="meta"></dl>
      <a class="openbtn" id="openfull" target="_blank" rel="noopener">↗ 全屏打开该 Demo</a>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script>
const TYPE_LABEL = {"General":["通用","landing"],"Landing Page":["落地页","landing"],"BI/Analytics":["数据面板","dash"],"Mobile":["移动端","mobile"],"Platform/Material":["平台系统","landing"],"Platform/System":["平台系统","landing"]};
const M = {active:"活跃", supplemental:"补充", deprecated:"已废弃"};
const SCENE_LABEL = {landing:"通用场景", dash:"数据面板场景", mobile:"移动端场景"};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

const qs = new URLSearchParams(location.search);
let idx = Math.max(0, UI_STYLES.findIndex(s => s.id === qs.get("id")));
if(UI_STYLES[idx] == null) idx = 0;
const D = UI_STYLES[idx];
const W = D.scene === "mobile" ? 460 : 960;
const H = D.scene === "mobile" ? 800 : 640;

document.title = D.zh + " · " + D.name + " — UI 风格 Demo";
document.getElementById("nm").textContent = D.name;
document.getElementById("zh").textContent = D.zh + " · " + (SCENE_LABEL[D.scene] || "");
document.getElementById("url").textContent = "demo.nova / " + D.id;
document.getElementById("openfull").href = "demos/" + D.id + ".html";

const [tl, tc] = TYPE_LABEL[D.type] || [D.type, "landing"];
document.getElementById("badges").innerHTML = `<span class="badge ${tc}">${tl}</span><span class="badge st-${D.status}">${M[D.status]||D.status}</span>`;
document.getElementById("kw").innerHTML = D.keywords.map(k => `<i>${esc(k)}</i>`).join("");
document.getElementById("bestfor").textContent = D.bestFor || "—";
document.getElementById("avoid").textContent = D.avoid || "—";
if(D.note){ document.getElementById("noteWrap").style.display = ""; document.getElementById("note").textContent = "ℹ️ " + D.note; }
document.getElementById("pal").innerHTML = D.palette.map(c => `<span class="pal"><i style="background:${c}"></i>${c}</span>`).join("");
document.getElementById("vars").textContent = D.varsText || "—";
document.getElementById("css").textContent = D.cssText || "—";
document.getElementById("effects").textContent = D.effects || "—";
const MODE_MAP = {"supported":"支持","not-recommended":"不推荐","conditional":"有条件支持","adaptable":"可适配","native":"原生级"};
document.getElementById("meta").innerHTML = [
  ["编号", "#" + D.no],
  ["风格 ID", D.id],
  ["年代 / 起源", D.era || "—"],
  ["复杂度", D.complexity || "—"],
  ["亮色模式", MODE_MAP[D.light] || D.light || "—"],
  ["暗色模式", MODE_MAP[D.dark] || D.dark || "—"],
  ["移动适配", MODE_MAP[D.mobile] || D.mobile || "—"],
  ["框架兼容", D.framework || "—"],
  ["备选名", D.alias || "—"]
].map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");

document.getElementById("prev").disabled = idx === 0;
document.getElementById("next").disabled = idx === UI_STYLES.length - 1;
document.getElementById("prev").onclick = () => { if(idx > 0) location.href = "style.html?id=" + UI_STYLES[idx-1].id; };
document.getElementById("next").onclick = () => { if(idx < UI_STYLES.length-1) location.href = "style.html?id=" + UI_STYLES[idx+1].id; };

const ifr = document.getElementById("ifr");
ifr.addEventListener("load", () => { document.getElementById("loading").style.display = "none"; });
ifr.src = "demos/" + D.id + ".html";

function fit(){
  const vp = document.getElementById("viewport");
  const cw = vp.clientWidth;
  const s = Math.min(1, cw / W);
  ifr.style.width = W + "px";
  ifr.style.height = H + "px";
  ifr.style.transform = "scale(" + s + ")";
  vp.style.height = (H * s) + "px";
}
window.addEventListener("resize", fit);
fit();
document.addEventListener("keydown", e => {
  if(e.key === "ArrowLeft" && idx > 0) location.href = "style.html?id=" + UI_STYLES[idx-1].id;
  if(e.key === "ArrowRight" && idx < UI_STYLES.length-1) location.href = "style.html?id=" + UI_STYLES[idx+1].id;
});
</script>
</body>
</html>

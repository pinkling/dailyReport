<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y2K Aesthetic · 千禧美学（Y2K） — UI 风格 Demo</title>
<style>
:root{--d-bg:#e6efff;--d-bg2:#d4e3ff;--d-fg:#1c2a5e;--d-sub:#5a6c9e;--d-card:rgba(255,255,255,.75);--d-line:rgba(120,160,255,.5);--d-primary:#3f6cff;--d-primary-fg:#ffffff;--d-accent:#ff5fd2;--d-radius:18px;--d-btn-radius:999px;--d-font:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--d-title-weight:900;--d-chrome1:#a8c3ff;--d-chrome2:#4f7cff;--d-chrome-line:rgba(120,160,255,.6);--d-bg-image:radial-gradient(46% 40% at 84% 6%,rgba(255,95,210,.25),transparent 60%),radial-gradient(50% 46% at 10% 20%,rgba(63,108,255,.3),transparent 62%),linear-gradient(170deg,#eef4ff,#dbe7ff)}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
body{
  background:var(--d-bg);background-image:var(--d-bg-image,none);
  background-size:var(--d-bg-size,auto);background-attachment:var(--d-bg-attach,fixed);
  color:var(--d-fg);font-family:var(--d-font);line-height:1.62;min-height:100vh;
}
.d-shell{max-width:900px;margin:0 auto;padding:16px 30px 26px;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.d-shell>*{position:relative;z-index:1}
.d-deco{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
/* nav */
.d-nav{display:flex;align-items:center;gap:16px;padding:8px 0}
.d-logo{font-weight:800;font-size:17.5px;font-family:var(--d-title-font,var(--d-font));letter-spacing:var(--d-logo-track,.03em);white-space:nowrap}
.d-links{display:flex;gap:18px;color:var(--d-sub);font-size:13.5px;flex:1;margin-left:8px;white-space:nowrap}
.d-links span{cursor:pointer;padding:4px 0;border-bottom:var(--d-link-border,2px solid transparent)}
.d-links span:hover{color:var(--d-fg);border-bottom-color:var(--d-accent)}
/* buttons */
.d-btn{border:var(--d-btn-border,none);cursor:pointer;font-family:var(--d-font);font-size:13.5px;font-weight:var(--d-btn-weight,600);padding:10px 20px;border-radius:var(--d-btn-radius,10px);background:var(--d-bg2);color:var(--d-fg);transition:all var(--d-btn-speed,.18s) ease;box-shadow:var(--d-btn-shadow,none);letter-spacing:var(--d-letter,0);text-transform:var(--d-btn-case,none)}
.d-btn:active{transform:var(--d-btn-active,translateY(1px))}
.d-btn:hover{box-shadow:var(--d-btn-shadow-hover,var(--d-btn-shadow,none));background:var(--d-btn-hover-bg,var(--d-bg2))}
.d-btn-primary{background:var(--d-primary);color:var(--d-primary-fg,#fff)}
.d-btn-primary:hover{background:var(--d-primary-hover,var(--d-primary))}
.d-btn-ghost{background:var(--d-ghost-bg,transparent);color:var(--d-ghost-fg,var(--d-fg));border:var(--d-ghost-border,1px solid var(--d-line))}
.d-btn-sm{padding:8px 15px;font-size:12.5px}
/* hero */
.d-hero{padding:36px 0 8px;text-align:var(--d-hero-align,center)}
.d-badge{display:inline-block;font-size:12px;padding:4px 13px;border-radius:var(--d-tag-radius,999px);border:1px solid var(--d-line);color:var(--d-sub);margin-bottom:18px;background:var(--d-badge-bg,transparent);font-family:var(--d-font)}
.d-h1{font-size:clamp(29px,4.6vw,45px);line-height:1.16;font-weight:var(--d-title-weight,800);letter-spacing:var(--d-h1-track,-.02em);font-family:var(--d-title-font,var(--d-font));margin-bottom:16px;color:var(--d-h1-color,var(--d-fg));text-transform:var(--d-h1-case,none);text-shadow:var(--d-h1-shadow,none)}
.d-sub{color:var(--d-sub);font-size:14.5px;max-width:540px;margin:0 auto 24px}
.d-btns{display:flex;gap:12px;justify-content:var(--d-justify,center);flex-wrap:wrap}
/* cards */
.d-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--d-card-gap,14px);margin-top:26px}
.d-card{background:var(--d-card);border:var(--d-border,none);border-radius:var(--d-radius);padding:20px 18px;box-shadow:var(--d-shadow,none);transition:all var(--d-btn-speed,.18s) ease;backdrop-filter:var(--d-card-blur,none);-webkit-backdrop-filter:var(--d-card-blur,none)}
.d-card:hover{box-shadow:var(--d-shadow-hover,var(--d-shadow,none));transform:var(--d-card-hover,translateY(-2px))}
.d-ico{font-size:19px;margin-bottom:10px;color:var(--d-primary);line-height:1}
.d-card h3{font-size:15px;font-weight:700;margin-bottom:5px;font-family:var(--d-title-font,var(--d-font));color:var(--d-card-fg,inherit)}
.d-card p{font-size:12.8px;color:var(--d-card-sub,var(--d-sub));line-height:1.55}
/* form */
.d-form{display:flex;gap:10px;max-width:440px;margin:28px auto 0;width:100%}
.d-input{flex:1;border:var(--d-input-border,1px solid var(--d-line));background:var(--d-input-bg,var(--d-card));color:var(--d-fg);border-radius:var(--d-btn-radius,10px);padding:10px 15px;font-size:13.5px;font-family:var(--d-font);outline:none;box-shadow:var(--d-input-shadow,none);min-width:0}
.d-input::placeholder{color:var(--d-sub);opacity:.8}
.d-input:focus{border-color:var(--d-focus,var(--d-accent))}
/* footer */
.d-footer{margin-top:auto;padding-top:26px;display:flex;align-items:center;justify-content:space-between;color:var(--d-sub);font-size:12px;flex-wrap:wrap;gap:10px}
.d-tags{display:flex;gap:8px;flex-wrap:wrap}
.d-tags i{font-style:normal;padding:3px 10px;border-radius:var(--d-tag-radius,999px);background:var(--d-tag-bg,var(--d-bg2));border:var(--d-tag-border,none);font-size:11.5px;color:var(--d-tag-fg,var(--d-sub))}


.d-h1{background:linear-gradient(180deg,#ffffff,var(--d-chrome1,#a8c3ff) 42%,var(--d-chrome2,#4f7cff) 56%,#dfe9ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(255,255,255,.5))}
.d-card,.d-kpi,.d-panel,.d-mhero,.d-mcell,.d-mrow{border:2px solid #ffffff;border-radius:18px;box-shadow:0 0 0 2px var(--d-chrome-line,rgba(120,160,255,.55)),0 16px 36px -14px rgba(80,130,255,.6);background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(214,228,255,.55))}
.d-btn{border-radius:999px;background:linear-gradient(180deg,#ffffff,#cfe0ff);border:1.5px solid #ffffff;box-shadow:0 0 0 1.5px var(--d-chrome-line,rgba(120,160,255,.55)),0 6px 16px -6px rgba(80,130,255,.7);color:#1c2a5e;font-weight:700}
.d-btn-primary{background:linear-gradient(180deg,#9fc0ff,#3f6cff);color:#fff}
.d-input{border-radius:999px;background:rgba(255,255,255,.85);border:1.5px solid var(--d-chrome-line,rgba(120,160,255,.55))}


.d-badge{background:linear-gradient(180deg,#ffffff,#d4e3ff);border:1.5px solid #fff;box-shadow:0 0 0 1.5px rgba(120,160,255,.5);color:#3f4e9e;font-weight:700}
.d-tags i{background:rgba(255,255,255,.85);border:1px solid rgba(120,160,255,.5)}
.d-input{box-shadow:inset 0 1px 3px rgba(63,108,255,.2)}

</style>
</head>
<body>

<div class="d-shell">
  <div class="d-deco"></div>
  <nav class="d-nav">
    <div class="d-logo">◆ Nova</div>
    <div class="d-links"><span>产品</span><span>方案</span><span>文档</span></div>
    <button class="d-btn d-btn-ghost d-btn-sm">登录</button>
    <button class="d-btn d-btn-primary d-btn-sm">免费开始</button>
  </nav>
  <section class="d-hero">
    <div class="d-badge">Nova 2.0 全新发布</div>
    <h1 class="d-h1">让每一次决策<br class="d-br">都有数据依据</h1>
    <p class="d-sub">为团队打造的现代分析平台，实时洞察业务增长，把复杂指标变成清晰结论。</p>
    <div class="d-btns">
      <button class="d-btn d-btn-primary">免费开始使用</button>
      <button class="d-btn d-btn-ghost">查看演示 →</button>
    </div>
  </section>
  <section class="d-cards">
    <div class="d-card"><div class="d-ico">◈</div><h3>实时分析</h3><p>毫秒级刷新，业务指标一目了然。</p></div>
    <div class="d-card"><div class="d-ico">◈</div><h3>协作共享</h3><p>看板一键分享，团队同频推进。</p></div>
    <div class="d-card"><div class="d-ico">◈</div><h3>安全合规</h3><p>企业级权限与全链路审计。</p></div>
  </section>
  <section class="d-form">
    <input class="d-input" placeholder="输入工作邮箱，获取试用资格">
    <button class="d-btn d-btn-primary">获取试用</button>
  </section>
  <footer class="d-footer">
    <span>© 2026 Nova Analytics</span>
    <div class="d-tags"><i>新上线</i><i>中文支持</i><i>免费版可用</i></div>
  </footer>
</div>

</body>
</html>

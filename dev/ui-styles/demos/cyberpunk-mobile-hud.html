<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk Mobile HUD · 赛博朋克移动 HUD — UI 风格 Demo</title>
<style>
:root{--d-bg:#0c0c10;--d-bg2:#14141c;--d-fg:#eafce8;--d-sub:rgba(190,255,190,.6);--d-card:rgba(16,16,22,.92);--d-line:#faff00;--d-primary:#faff00;--d-primary-fg:#151500;--d-accent:#00e5ff;--d-radius:0px;--d-btn-radius:0px;--d-font:"Cascadia Mono",Consolas,"Courier New",monospace;--d-title-font:"Cascadia Mono",Consolas,"Courier New",monospace;--d-title-weight:800;--d-mbg:#070709;--d-cyan:#00e5ff;--d-bar:#faff00;--d-bar-track:#22222a;--d-phone-radius:12px}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--d-mbg,var(--d-bg2));background-image:var(--d-mbg-image,none);font-family:var(--d-font);color:var(--d-fg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.d-phone{width:375px;max-width:100%;height:716px;background:var(--d-bg);border-radius:var(--d-phone-radius,38px);border:var(--d-phone-border,none);box-shadow:var(--d-phone-shadow,0 26px 70px -20px rgba(0,0,0,.4));overflow:hidden;display:flex;flex-direction:column;position:relative;isolation:isolate}
.d-phone::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5;border:var(--d-phone-border,none)}
.d-mstatus{display:flex;justify-content:space-between;align-items:center;padding:13px 24px 7px;font-size:12.5px;font-weight:600;color:var(--d-fg);position:relative;z-index:1}
.d-mstatus .sig{letter-spacing:2px;font-size:9px}
.d-mhead{display:flex;justify-content:space-between;align-items:center;padding:9px 20px 12px;position:relative;z-index:1}
.d-mhead h3{font-size:17px;font-weight:var(--d-title-weight,800);font-family:var(--d-title-font,var(--d-font))}
.d-mhead p{font-size:12px;color:var(--d-sub);margin-top:2px}
.d-mavatar{width:38px;height:38px;border-radius:var(--d-avatar-radius,50%);background:var(--d-primary);color:var(--d-primary-fg,#fff);display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;box-shadow:var(--d-shadow,none);border:var(--d-avatar-border,none);flex-shrink:0}
.d-mhero{margin:4px 16px 0;background:var(--d-card);border:var(--d-border,none);border-radius:var(--d-radius);padding:16px;box-shadow:var(--d-shadow,none);backdrop-filter:var(--d-card-blur,none);-webkit-backdrop-filter:var(--d-card-blur,none);position:relative;z-index:1}
.d-mhero>span{font-size:12px;color:var(--d-sub);display:block}
.d-mhero b{font-size:26px;font-weight:800;display:block;margin:7px 0 13px;letter-spacing:-.01em;font-family:var(--d-num-font,var(--d-title-font,var(--d-font)));color:var(--d-card-fg,inherit)}
.d-mhero .d-mbar{height:8px;background:var(--d-bar-track,var(--d-bg2));border-radius:99px;overflow:hidden}
.d-mbar i{display:block;height:100%;width:64%;background:var(--d-bar,var(--d-primary));border-radius:99px}
.d-mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px 0;position:relative;z-index:1}
.d-mcell{background:var(--d-card);border:var(--d-border,none);border-radius:var(--d-radius);padding:12px 14px;box-shadow:var(--d-shadow,none);backdrop-filter:var(--d-card-blur,none);-webkit-backdrop-filter:var(--d-card-blur,none)}
.d-mcell b{font-size:16px;font-weight:800;display:block;font-family:var(--d-num-font,var(--d-title-font,var(--d-font)));color:var(--d-card-fg,inherit)}
.d-mcell small{font-size:11px;color:var(--d-sub)}
.d-mlist{margin:10px 16px 0;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.d-mrow{display:flex;align-items:center;gap:12px;background:var(--d-card);border:var(--d-border,none);border-radius:var(--d-radius);padding:11px 13px;box-shadow:var(--d-shadow,none);backdrop-filter:var(--d-card-blur,none);-webkit-backdrop-filter:var(--d-card-blur,none)}
.d-mico{width:34px;height:34px;border-radius:var(--d-ico-radius,10px);background:var(--d-bg2);display:flex;align-items:center;justify-content:center;font-size:15px;font-style:normal;flex-shrink:0;border:var(--d-border,none)}
.d-mrow>div{flex:1;min-width:0}
.d-mrow b{font-size:13px;font-weight:600;display:block;color:var(--d-card-fg,inherit)}
.d-mrow small{font-size:11px;color:var(--d-sub)}
.d-mrow>span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--d-card-fg,inherit)}
.d-mtab{margin-top:auto;display:flex;border-top:var(--d-mtab-border,1px solid var(--d-line));background:var(--d-mtab-bg,var(--d-bg));position:relative;z-index:1}
.d-mtab span{flex:1;text-align:center;padding:10px 0 14px;font-size:15px;color:var(--d-sub);cursor:pointer;line-height:1.2}
.d-mtab span i{display:block;font-style:normal;font-size:10.5px;margin-top:3px}
.d-mtab span.on{color:var(--d-primary)}


body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(0,0,0,.17) 0 1px,transparent 1px 3px)}
.d-card,.d-kpi,.d-panel,.d-mhero,.d-mcell,.d-mrow,.d-input,.d-badge,.d-tags i,.d-chip,.d-mhero,.d-mcell,.d-mrow{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.d-card,.d-kpi,.d-panel,.d-mhero,.d-mcell,.d-mrow,.d-input,.d-mhero,.d-mcell,.d-mrow{border:1px solid var(--d-primary);background:var(--d-card);box-shadow:none;border-radius:0}
.d-h1{color:var(--d-primary);text-shadow:2px 0 var(--d-accent),-2px 0 var(--d-cyan,#00e5ff)}
.d-btn{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));border-radius:0;font-weight:700}
.d-btn-primary{background:var(--d-primary);color:var(--d-bg)}
.d-btn-ghost{background:transparent;border:1px solid var(--d-accent);color:var(--d-accent)}
.d-badge,.d-tags i,.d-chip{border:1px solid var(--d-accent);background:transparent;border-radius:0}


.d-phone{border:1px solid rgba(250,255,0,.5)}
.d-mhead h3{color:#faff00;text-shadow:2px 0 #00e5ff,-1px 0 #ff00ff}
.d-mhero b{color:#faff00}
.d-mhero .d-mbar i{background:#00e5ff}
.d-mtab span.on{color:#faff00}
.d-mavatar{background:#faff00;color:#151500;border-radius:0}
.d-mico{border-radius:0;border:1px solid rgba(250,255,0,.4);background:transparent;color:#00e5ff}

</style>
</head>
<body>

<div class="d-phone">
  <div class="d-mstatus"><span>9:41</span><span class="sig">▪▪▪ ⌁ ▮</span></div>
  <div class="d-mhead">
    <div><h3>早上好，Nova</h3><p>10 月 11 日 · 周日</p></div>
    <div class="d-mavatar">N</div>
  </div>
  <div class="d-mhero">
    <span>本月预算剩余</span>
    <b>¥12,580.00</b>
    <div class="d-mbar"><i></i></div>
  </div>
  <div class="d-mgrid">
    <div class="d-mcell"><b>+8.2%</b><small>储蓄率周同比</small></div>
    <div class="d-mcell"><b>¥2,340</b><small>本周支出</small></div>
  </div>
  <div class="d-mlist">
    <div class="d-mrow"><i class="d-mico">☕</i><div><b>咖啡与早餐</b><small>今天 09:12 · 餐饮</small></div><span>-¥28</span></div>
    <div class="d-mrow"><i class="d-mico">◈</i><div><b>打车出行</b><small>昨天 18:40 · 交通</small></div><span>-¥45</span></div>
    <div class="d-mrow"><i class="d-mico">✦</i><div><b>工资入账</b><small>10 月 10 日 · 收入</small></div><span>+¥8,500</span></div>
  </div>
  <div class="d-mtab">
    <span class="on">⌂<i>首页</i></span><span>◔<i>账单</i></span><span>＋<i>记账</i></span><span>◉<i>我的</i></span>
  </div>
</div>

</body>
</html>

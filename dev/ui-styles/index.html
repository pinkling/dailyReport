<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UI 风格图鉴 · 开发模块</title>
<style>
:root{--bg:#0b0f1a;--card:#131a2b;--card2:#1a2337;--line:#243049;--txt:#e8edf7;--sub:#93a1bd;--neon:#3ddc97;--neon-dim:rgba(61,220,151,.14);--neon-line:rgba(61,220,151,.35);--blue:#5b8cff;--gold:#f5c451;--purple:#c084fc}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#2b3a5c;border-radius:3px}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px}
header{padding:22px 0 4px}
.back{color:var(--sub);font-size:12.5px;text-decoration:none}
.back:hover{color:var(--neon)}
h1{font-size:22px;letter-spacing:.5px;margin-top:8px}
.sub{color:var(--sub);font-size:12.5px;margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 0}
input[type=search]{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 14px;font-size:13.5px;outline:none}
input[type=search]:focus{border-color:var(--neon-line);box-shadow:0 0 0 3px rgba(61,220,151,.1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;user-select:none;transition:.12s}
.chip.on{background:var(--neon-dim);border-color:var(--neon-line);color:var(--neon);font-weight:600}
.count{color:var(--sub);font-size:12px;margin:14px 2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(234px,1fr));gap:12px;margin-top:10px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 0 12px;text-decoration:none;color:var(--txt);transition:.15s;overflow:hidden}
.card:hover{border-color:var(--neon-line);transform:translateY(-2px);background:var(--card2)}
.sw{display:flex;height:54px;border-bottom:1px solid var(--line)}
.sw i{flex:1}
.nm{font-size:14.5px;font-weight:700;margin:10px 14px 1px;line-height:1.35}
.zh{font-size:12px;color:var(--sub);margin:0 14px 8px}
.kw{display:flex;flex-wrap:wrap;gap:4px;margin:0 14px;min-height:20px}
.kw i{font-style:normal;font-size:10.5px;color:var(--sub);background:var(--bg);border:1px solid var(--line);padding:1px 7px;border-radius:6px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.mt{display:flex;gap:6px;margin:10px 14px 0;font-size:10.5px;flex-wrap:wrap}
.badge{padding:1px 8px;border-radius:999px;font-weight:700}
.badge.landing{background:rgba(91,140,255,.16);color:#9db9ff}
.badge.dash{background:rgba(245,196,81,.14);color:var(--gold)}
.badge.mobile{background:rgba(192,132,252,.16);color:var(--purple)}
.badge.st-active{background:var(--neon-dim);color:var(--neon)}
.badge.st-supplemental{background:rgba(91,140,255,.14);color:#9db9ff}
.badge.st-deprecated{background:rgba(147,161,189,.14);color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:44px 0;font-size:13px}
footer{text-align:center;color:var(--sub);font-size:11px;margin-top:34px;opacity:.7}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:9px}.nm{font-size:13px;margin:9px 11px 1px}.zh{margin:0 11px 7px}.kw{margin:0 11px}.mt{margin:9px 11px 0}.sw{height:44px}h1{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="back" href="../">← 返回首页</a>
  <h1>🎨 UI 风格图鉴</h1>
  <div class="sub">88 种界面风格 · 点击任意风格查看实样 Demo · 数据源：UI UX Pro Max</div>
</header>
<div class="tools">
  <input id="q" type="search" placeholder="搜索：风格名 / 中文名 / 关键词…" autocomplete="off">
</div>
<div class="tools"><div class="chips" id="typeChips"></div></div>
<div class="tools"><div class="chips" id="stChips"></div></div>
<div class="count" id="count">—</div>
<div class="grid" id="grid"></div>
<footer>Nova 开发模块 · 风格数据来自 UI UX Pro Max（styles.csv，共 88 种）</footer>
</div>
<script src="data.js"></script>
<script>
const TYPE_LABEL = {
  "General": ["通用", "landing"],
  "Landing Page": ["落地页", "landing"],
  "BI/Analytics": ["数据面板", "dash"],
  "Mobile": ["移动端", "mobile"],
  "Platform/Material": ["平台系统", "landing"],
  "Platform/System": ["平台系统", "landing"]
};
const TYPE_FILTERS = [["all","全部"],["gen","通用"],["landing","落地页"],["dash","数据面板"],["mobile","移动端"],["sys","平台系统"]];
const ST_FILTERS = [["all","全部"],["active","活跃"],["supplemental","补充"],["deprecated","已废弃"]];
let fType = "all", fSt = "all", fQ = "";

function typeKey(t){
  if(t === "General") return "gen";
  if(t === "Landing Page") return "landing";
  if(t === "BI/Analytics") return "dash";
  if(t === "Mobile") return "mobile";
  return "sys";
}
function typeBadge(t){
  const [lbl, cls] = TYPE_LABEL[t] || [t, "landing"];
  return `<span class="badge ${cls}">${lbl}</span>`;
}
function stBadge(s){
  const m = {active:"活跃", supplemental:"补充", deprecated:"已废弃"};
  return `<span class="badge st-${s}">${m[s]||s}</span>`;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderChips(el, arr, cur, onPick){
  el.innerHTML = arr.map(([k,l]) => `<div class="chip${k===cur?" on":""}" data-k="${k}">${l}</div>`).join("");
  el.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => onPick(c.dataset.k)));
}
function render(){
  const arr = UI_STYLES.filter(s => {
    if(fType !== "all" && typeKey(s.type) !== fType) return false;
    if(fSt !== "all" && s.status !== fSt) return false;
    if(fQ){
      const q = fQ.toLowerCase();
      const hay = (s.name + " " + s.zh + " " + s.id + " " + s.keywords.join(" ")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById("count").textContent = `共 ${arr.length} 种风格`;
  const g = document.getElementById("grid");
  if(!arr.length){ g.innerHTML = `<div class="empty" style="grid-column:1/-1">没有匹配的风格</div>`; return; }
  g.innerHTML = arr.map(s => {
    const sw = (s.palette.length ? s.palette : ["#333"]).slice(0, 5)
      .map(c => `<i style="background:${c}"></i>`).join("");
    const kw = s.keywords.slice(0, 3).map(k => `<i>${esc(k)}</i>`).join("");
    return `<a class="card" href="style.html?id=${s.id}">
      <div class="sw">${sw}</div>
      <div class="nm">${esc(s.name)}</div>
      <div class="zh">${esc(s.zh)}</div>
      <div class="kw">${kw}</div>
      <div class="mt">${typeBadge(s.type)}${stBadge(s.status)}</div>
    </a>`;
  }).join("");
}
function pickType(k){ fType = k; refreshChips(); render(); }
function pickSt(k){ fSt = k; refreshChips(); render(); }
function refreshChips(){
  renderChips(document.getElementById("typeChips"), TYPE_FILTERS, fType, pickType);
  renderChips(document.getElementById("stChips"), ST_FILTERS, fSt, pickSt);
}
refreshChips();
render();
document.getElementById("q").addEventListener("input", e => { fQ = e.target.value.trim(); render(); });
</script>
</body>
</html>
